<!--
  The mark drawn on the splash screen.

  Transparent, because the splash drawable paints the background colour as its
  own layer and centres this on top. That way one bitmap serves every screen
  size and aspect ratio without ever being stretched.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="114" fill="#C6A15B" fill-opacity="0.10"/>
  <rect x="2" y="2" width="508" height="508" rx="112" fill="none"
        stroke="#C6A15B" stroke-opacity="0.28" stroke-width="4"/>
  <g transform="translate(256 256) scale(12.8) translate(-12 -12)"
     fill="none" stroke="#C6A15B" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17"/>
    <path d="M15 9h4a1 1 0 0 1 1 1v11"/>
    <path d="M3 21h18M8 7h3M8 11h3M8 15h3"/>
  </g>
</svg>
