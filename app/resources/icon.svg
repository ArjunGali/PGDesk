  <rect x="112.5" y="112.5" width="799" height="799" rx="175.5" fill="none"
        stroke="#C6A15B" stroke-opacity="0.32" stroke-width="5"/>
  <g transform="translate(512 512) scale(20) translate(-12 -12)"
     fill="none" stroke="#C6A15B" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17"/>
    <path d="M15 9h4a1 1 0 0 1 1 1v11"/>
