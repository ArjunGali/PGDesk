# Local / self-hosted stack. Everything here is open source and free to run on
# the owner's own machine or LAN server — no paid cloud service is required.
services:
  postgres:
    image: postgres:16-alpine
    container_name: pgm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — there is deliberately no default}
      POSTGRES_DB: ${POSTGRES_DB:-pg_management}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgm-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pgm} -d ${POSTGRES_DB:-pg_management}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: pgm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pgm}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pg_management}?schema=public
      PORT: 3000
      # No defaults for secrets: a stack that starts without them would be
      # running on a key published in this repository.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — generate with: openssl rand -hex 32}
      AADHAAR_ENCRYPTION_KEY: ${AADHAAR_ENCRYPTION_KEY:?Set AADHAAR_ENCRYPTION_KEY in .env — generate with: openssl rand -base64 32}
      STORAGE_ROOT: /data/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,capacitor://localhost,http://localhost,https://localhost}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - pgm-storage:/data/storage

volumes:
  pgm-data:
  pgm-storage:
